[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haus-ha"
version = "0.1.0"
description = "Cache-first, usage-aware command line for Home Assistant — built for humans and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marko Stipanov" }]
keywords = ["home-assistant", "cli", "smart-home", "llm", "agents", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
haus = "haus:main"

[project.urls]
Homepage = "https://github.com/mstipanov/haus-ha"
Repository = "https://github.com/mstipanov/haus-ha"
Issues = "https://github.com/mstipanov/haus-ha/issues"

[tool.setuptools]
py-modules = ["haus"]
